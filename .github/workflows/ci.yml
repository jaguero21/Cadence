name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (iOS simulator)
    # Xcode 27 is required: the app, widget, and watch targets are Swift 6
    # language mode on the iOS 27 SDK. `macos-latest` (the macOS 26 image) tops
    # out at Xcode 26.6, so use GitHub's Xcode 27 image (public preview as of
    # 2026-09; actions/runner-images#14404). Move back to a GA label once one
    # ships Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Pinned to the Xcode 27 line, not "newest on the runner". Swift 6
      # diagnostics change between compiler versions, so floating to whatever the
      # image adds next can turn CI red with no code change, and an older Xcode
      # can't build this project at all. Newest 27.x wins, so the image moving
      # from a beta to the release is picked up automatically.
      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 27 on this runner. Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # The Cadence scheme embeds the watch app, so building it requires a
      # watchOS simulator runtime. Runner images usually ship one for the
      # selected Xcode; download only if it's missing.
      - name: Ensure watchOS simulator runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q watchOS; then
            echo "watchOS runtime missing — downloading"
            sudo xcodebuild -downloadPlatform watchOS
          fi
          xcrun simctl list runtimes

      - name: Pick an iPhone simulator destination
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data['devices'].items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid']); sys.exit(0)
          sys.exit(1)")
          echo "Selected simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          # -testPlan is explicit on purpose. The scheme's Testables list once
          # held only CadenceUITests, so this command ran ONE test and still
          # printed "** TEST SUCCEEDED **" — the unit suites never executed and
          # CI was green on nothing. Naming the plan makes the intent
          # independent of the scheme's Testables ordering.
          xcodebuild test \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -testPlan Cadence \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            2>&1 | tee xcodebuild.log | grep -E "^(Test Suite|Test Case|✔|✘)|error:|warning: main actor|\*\* (BUILD|TEST)" || true
          # Fail the job on the real xcodebuild exit code, not the grep's.
          tail -5 xcodebuild.log
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      # "TEST SUCCEEDED" alone is not a gate — it is equally true when almost
      # nothing ran. Assert the unit suite actually executed at roughly its
      # real size, so a scheme/test-plan regression fails loudly instead of
      # silently shrinking coverage to a green checkmark.
      - name: Assert the unit suite actually ran
        run: |
          MIN_TESTS=200
          SUMMARY=$(grep -oE "Test run with [0-9]+ tests? in [0-9]+ suites? passed" xcodebuild.log | tail -1 || true)
          if [ -z "$SUMMARY" ]; then
            echo "::error::No Swift Testing summary found — the CadenceTests target did not run."
            exit 1
          fi
          COUNT=$(echo "$SUMMARY" | grep -oE "[0-9]+" | head -1)
          echo "Swift Testing reported: $SUMMARY"
          if [ "$COUNT" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $COUNT unit tests ran, expected at least $MIN_TESTS. Coverage regressed."
            exit 1
          fi

      # Swift 6 makes concurrency mistakes errors, but deprecations and other
      # warnings still build green. App, widget, and watch are held to zero; the
      # test targets stay on older Swift modes and are excluded. See the script
      # for how macro-expansion warnings (#Predicate, #expect) are attributed.
      - name: Fail on compiler warnings (app, widget, watch)
        run: python3 .github/scripts/check_warnings.py xcodebuild.log

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
